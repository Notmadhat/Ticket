<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse Ticket Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#151920; --paper:#FFFFFF; --canvas:#F0F2F6;
    --steel:#2B3A55; --steel-deep:#1D2740;
    --amber:#F2A93B; --amber-deep:#D98F1F;
    --teal:#2A9D8F; --ok:#2F9E58; --danger:#D64545;
    --line:rgba(21,25,32,0.13); --muted:#5B6472;
    --font-head:'Barlow Semi Condensed',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--canvas);color:var(--ink);font-family:var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}

  header.site{background:var(--steel-deep);color:#fff;padding:18px 24px;}
  .site-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
  .site-title{font-family:var(--font-head);font-weight:700;font-size:24px;letter-spacing:.01em;}
  .site-sub{font-size:12.5px;color:rgba(255,255,255,0.6);margin-top:2px;}
  .new-ticket-btn{background:var(--amber);color:var(--steel-deep);border:none;padding:11px 20px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s ease;}
  .new-ticket-btn:hover{transform:translateY(-1px);}

  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}

  /* stats strip */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px;}
  @media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr);}}
  .stat-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
  .stat-num{font-family:var(--font-head);font-size:30px;font-weight:700;color:var(--steel-deep);}
  .stat-label{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .stat-card.urgent .stat-num{color:var(--danger);}

  /* warehouse bay directory */
  .directory h2{font-family:var(--font-head);font-size:22px;font-weight:700;margin:0 0 4px;color:var(--steel-deep);}
  .directory p{margin:0 0 16px;color:var(--muted);font-size:13.5px;}
  .bay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;margin-bottom:40px;}
  .bay{
    background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:10px 4px 8px;
    text-align:center;cursor:pointer;transition:border-color .15s ease,transform .15s ease;position:relative;
  }
  .bay:hover{border-color:var(--amber-deep);transform:translateY(-2px);}
  .bay.has-urgent{border-color:var(--danger);}
  .bay-letter{font-family:var(--font-head);font-size:26px;font-weight:700;color:var(--steel-deep);line-height:1;}
  .bay-count{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-top:4px;}
  .bay-count.has-open{color:var(--amber-deep);font-weight:600;}

  /* filters */
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;padding-top:24px;border-top:1px solid var(--line);}
  .filters select,.filters input{
    padding:9px 12px;border-radius:7px;border:1px solid var(--line);background:var(--paper);
    color:var(--ink);font-family:var(--font-body);font-size:13.5px;
  }
  .filters input[type=text]{flex:1;min-width:160px;}

  /* ticket board */
  .board{display:flex;flex-direction:column;gap:10px;}
  .ticket-row{
    background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    display:grid;grid-template-columns:auto auto 1fr auto auto auto;gap:14px;align-items:center;cursor:pointer;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .ticket-row:hover{border-color:var(--steel);box-shadow:0 4px 14px rgba(21,25,32,0.07);}
  @media (max-width:820px){
    .ticket-row{grid-template-columns:1fr;grid-template-areas:"a" "b" "c" "d";}
  }
  .t-id{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);}
  .t-bay{
    width:34px;height:34px;border-radius:7px;background:var(--steel-deep);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:16px;flex-shrink:0;
  }
  .t-title{font-weight:600;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t-title-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .badge{
    display:inline-block;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;
    border:1px solid transparent;white-space:nowrap;
  }
  .badge.remote{background:rgba(42,157,143,0.12);color:var(--teal);}
  .badge.onsite{background:rgba(242,169,59,0.15);color:var(--amber-deep);}
  .badge.pri-low{background:rgba(91,100,114,0.1);color:var(--muted);}
  .badge.pri-medium{background:rgba(43,58,85,0.1);color:var(--steel);}
  .badge.pri-high{background:rgba(242,169,59,0.15);color:var(--amber-deep);}
  .badge.pri-urgent{background:rgba(214,69,69,0.13);color:var(--danger);}
  .badge.status-open{background:rgba(43,58,85,0.1);color:var(--steel);}
  .badge.status-progress{background:rgba(42,157,143,0.12);color:var(--teal);}
  .badge.status-resolved{background:rgba(47,158,88,0.13);color:var(--ok);}
  .badge.status-cancelled{background:rgba(91,100,114,0.1);color:var(--muted);}

  .empty-state{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:44px 20px;text-align:center;color:var(--muted);font-size:14px;}

  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(21,25,32,0.5);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;overflow-y:auto;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--paper);border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;margin:auto;box-shadow:0 30px 60px -20px rgba(21,25,32,0.35);}
  .modal h2{font-family:var(--font-head);font-size:22px;font-weight:700;margin:0 0 4px;color:var(--steel-deep);}
  .modal .sub{color:var(--muted);font-size:13px;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 12px;border-radius:7px;border:1px solid var(--line);background:var(--canvas);
    color:var(--ink);font-family:var(--font-body);font-size:14px;
  }
  .field textarea{min-height:80px;resize:vertical;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .radio-pair{display:flex;gap:10px;}
  .radio-opt{
    flex:1;border:1.5px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;text-align:center;font-size:13px;font-weight:600;color:var(--muted);
  }
  .radio-opt.picked{border-color:var(--steel);background:rgba(43,58,85,0.06);color:var(--steel-deep);}
  .radio-opt .ro-title{font-size:13.5px;}
  .radio-opt .ro-sub{font-weight:400;font-size:11px;margin-top:3px;color:var(--muted);}
  .btn-primary{width:100%;background:var(--steel-deep);color:#fff;border:none;padding:13px;border-radius:8px;font-weight:700;font-size:14.5px;cursor:pointer;margin-top:6px;}
  .btn-secondary{width:100%;background:transparent;color:var(--steel-deep);border:1.5px solid var(--line);padding:12px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;margin-top:8px;}

  .detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .detail-desc{font-size:14px;line-height:1.6;color:var(--ink);margin-bottom:18px;white-space:pre-wrap;}
  .status-steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .step-btn{border:1px solid var(--line);background:var(--canvas);color:var(--muted);font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:999px;cursor:pointer;}
  .step-btn.current{background:var(--steel-deep);color:#fff;border-color:var(--steel-deep);}
  .step-btn.cancel{color:var(--danger);}
  .step-btn.cancel.current{background:var(--danger);border-color:var(--danger);}
  .log-list{border-top:1px solid var(--line);padding-top:14px;margin-top:6px;}
  .log-item{font-size:12.5px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line);}
  .log-item b{color:var(--ink);}

  footer{padding:24px;text-align:center;color:var(--muted);font-size:12px;}
</style>
</head>
<body>

<header class="site">
  <div class="site-inner">
    <div>
      <div class="site-title">Warehouse Ticket Desk</div>
      <div class="site-sub">File a problem, pick a warehouse, track it through to done.</div>
    </div>
    <button class="new-ticket-btn" onclick="openNewTicket()">New ticket</button>
  </div>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <div class="directory">
    <h2>Pick a warehouse</h2>
    <p>Tap a bay to file a ticket for that warehouse, or use "New ticket" above.</p>
    <div class="bay-grid" id="bay-grid"></div>
  </div>

  <div class="filters">
    <select id="f-warehouse" onchange="renderBoard()"><option value="">All warehouses</option></select>
    <select id="f-type" onchange="renderBoard()">
      <option value="">All types</option>
      <option value="remote">Remote-fixable</option>
      <option value="onsite">Needs on-site</option>
    </select>
    <select id="f-status" onchange="renderBoard()">
      <option value="">All statuses</option>
      <option value="open">Open</option>
      <option value="progress">In progress</option>
      <option value="resolved">Resolved</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <input type="text" id="f-search" placeholder="Search tickets..." oninput="renderBoard()">
  </div>

  <div class="board" id="board"></div>
</div>

<footer>Warehouse Ticket Desk — for the office game</footer>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const WAREHOUSES = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const PRIORITIES = ['low','medium','high','urgent'];
const PRIORITY_LABELS = {low:'Low priority',medium:'Medium priority',high:'High priority',urgent:'Urgent'};
const STATUS_LABELS = {open:'Open',progress:'In progress',resolved:'Resolved',cancelled:'Cancelled'};

function loadTickets(){ try{ return JSON.parse(localStorage.getItem('ticketdesk_tickets')||'[]'); }catch(e){ return []; } }
function saveTickets(list){ try{ localStorage.setItem('ticketdesk_tickets', JSON.stringify(list)); }catch(e){} }
function nextTicketNum(){
  let n = parseInt(localStorage.getItem('ticketdesk_counter')||'1000',10);
  n += 1;
  try{ localStorage.setItem('ticketdesk_counter', String(n)); }catch(e){}
  return n;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent = s==null? '' : String(s); return d.innerHTML; }
function timeAgo(ts){
  const mins = Math.floor((Date.now()-ts)/60000);
  if(mins<1) return 'just now';
  if(mins<60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs<24) return hrs+'h ago';
  return Math.floor(hrs/24)+'d ago';
}

let tickets = loadTickets();
let activeTicketId = null;
let pickedType = null;
let pickedPriority = 'medium';
let pickedWarehouse = null;

function populateWarehouseSelects(){
  const filterSel = document.getElementById('f-warehouse');
  WAREHOUSES.forEach(w => {
    const opt = document.createElement('option');
    opt.value = w; opt.textContent = 'Warehouse ' + w;
    filterSel.appendChild(opt);
  });
}

function renderStats(){
  const open = tickets.filter(t=>t.status==='open').length;
  const onsitePending = tickets.filter(t=>t.type==='onsite' && (t.status==='open'||t.status==='progress')).length;
  const remotePending = tickets.filter(t=>t.type==='remote' && (t.status==='open'||t.status==='progress')).length;
  const today = new Date(); today.setHours(0,0,0,0);
  const resolvedToday = tickets.filter(t=>t.status==='resolved' && t.resolvedAt && t.resolvedAt >= today.getTime()).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-num">${open}</div><div class="stat-label">Open tickets</div></div>
    <div class="stat-card"><div class="stat-num">${onsitePending}</div><div class="stat-label">On-site pending</div></div>
    <div class="stat-card"><div class="stat-num">${remotePending}</div><div class="stat-label">Remote pending</div></div>
    <div class="stat-card"><div class="stat-num">${resolvedToday}</div><div class="stat-label">Resolved today</div></div>
  `;
}

function renderBayGrid(){
  const grid = document.getElementById('bay-grid');
  grid.innerHTML = WAREHOUSES.map(w => {
    const ts = tickets.filter(t=>t.warehouse===w && t.status!=='resolved' && t.status!=='cancelled');
    const urgent = ts.some(t=>t.priority==='urgent');
    return `
      <div class="bay ${urgent?'has-urgent':''}" onclick="openNewTicket('${w}')">
        <div class="bay-letter">${w}</div>
        <div class="bay-count ${ts.length?'has-open':''}">${ts.length ? ts.length+' open' : '—'}</div>
      </div>
    `;
  }).join('');
}

function renderBoard(){
  const fw = document.getElementById('f-warehouse').value;
  const ft = document.getElementById('f-type').value;
  const fs = document.getElementById('f-status').value;
  const fq = document.getElementById('f-search').value.trim().toLowerCase();

  let list = tickets.slice().sort((a,b)=>b.createdAt-a.createdAt);
  if(fw) list = list.filter(t=>t.warehouse===fw);
  if(ft) list = list.filter(t=>t.type===ft);
  if(fs) list = list.filter(t=>t.status===fs);
  if(fq) list = list.filter(t=> (t.title+' '+t.desc).toLowerCase().includes(fq));

  const board = document.getElementById('board');
  if(list.length===0){
    board.innerHTML = `<div class="empty-state">No tickets match. File one from a warehouse above, or clear your filters.</div>`;
    return;
  }
  board.innerHTML = list.map(t => `
    <div class="ticket-row" onclick="openDetail('${t.id}')">
      <div class="t-id">#${t.num}</div>
      <div class="t-bay">${t.warehouse}</div>
      <div>
        <div class="t-title">${escapeHtml(t.title)}</div>
        <div class="t-title-sub">${escapeHtml(t.reporter||'Unnamed')} · ${timeAgo(t.createdAt)}</div>
      </div>
      <span class="badge ${t.type==='remote'?'remote':'onsite'}">${t.type==='remote'?'Remote-fixable':'Needs on-site'}</span>
      <span class="badge pri-${t.priority}">${PRIORITY_LABELS[t.priority]}</span>
      <span class="badge status-${t.status}">${STATUS_LABELS[t.status]}</span>
    </div>
  `).join('');
}

function renderAll(){
  renderStats();
  renderBayGrid();
  renderBoard();
}

/* ---------- new ticket ---------- */
function openNewTicket(warehouse){
  pickedType = null;
  pickedPriority = 'medium';
  pickedWarehouse = warehouse || null;
  const modal = document.getElementById('modal-content');
  modal.innerHTML = `
    <h2>New ticket</h2>
    <p class="sub">${warehouse ? 'Filing for warehouse '+warehouse+'.' : 'Describe the problem and pick where it is.'}</p>
    <div class="err-box" id="nt-err" style="display:none;color:var(--danger);font-size:12.5px;margin-bottom:10px;"></div>
    <div class="field-row">
      <div class="field">
        <label>Warehouse</label>
        <select id="nt-warehouse">
          ${WAREHOUSES.map(w=>`<option value="${w}" ${warehouse===w?'selected':''}>Warehouse ${w}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Reported by</label>
        <input id="nt-reporter" type="text" placeholder="Your name">
      </div>
    </div>
    <div class="field">
      <label>Problem title</label>
      <input id="nt-title" type="text" placeholder="Conveyor belt jammed at dock 3">
    </div>
    <div class="field">
      <label>Details</label>
      <textarea id="nt-desc" placeholder="What's happening, what you've already tried"></textarea>
    </div>
    <div class="field">
      <label>Can this be fixed without being there?</label>
      <div class="radio-pair">
        <div class="radio-opt" id="ro-remote" onclick="pickType('remote')">
          <div class="ro-title">Remote-fixable</div>
          <div class="ro-sub">Can be talked through or fixed from anywhere</div>
        </div>
        <div class="radio-opt" id="ro-onsite" onclick="pickType('onsite')">
          <div class="ro-title">Needs on-site</div>
          <div class="ro-sub">Someone has to physically be there</div>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Priority</label>
      <select id="nt-priority">
        ${PRIORITIES.map(p=>`<option value="${p}" ${p==='medium'?'selected':''}>${PRIORITY_LABELS[p]}</option>`).join('')}
      </select>
    </div>
    <button class="btn-primary" onclick="submitTicket()">File ticket</button>
    <button class="btn-secondary" onclick="closeModal()">Cancel</button>
  `;
  document.getElementById('modal-overlay').classList.add('open');
}

function pickType(type){
  pickedType = type;
  document.getElementById('ro-remote').classList.toggle('picked', type==='remote');
  document.getElementById('ro-onsite').classList.toggle('picked', type==='onsite');
}

function submitTicket(){
  const warehouse = document.getElementById('nt-warehouse').value;
  const reporter = document.getElementById('nt-reporter').value.trim();
  const title = document.getElementById('nt-title').value.trim();
  const desc = document.getElementById('nt-desc').value.trim();
  const priority = document.getElementById('nt-priority').value;
  const err = document.getElementById('nt-err');

  if(!title){ err.textContent='Give the ticket a title.'; err.style.display='block'; return; }
  if(!pickedType){ err.textContent='Pick whether this needs someone on-site.'; err.style.display='block'; return; }

  const ticket = {
    id: 'tk_'+Date.now()+'_'+Math.floor(Math.random()*1e6),
    num: nextTicketNum(),
    warehouse, reporter, title, desc, priority,
    type: pickedType, status: 'open',
    createdAt: Date.now(), resolvedAt: null,
    log: [{ note:'Ticket filed', ts: Date.now() }]
  };
  tickets.unshift(ticket);
  saveTickets(tickets);
  closeModal();
  renderAll();
}

/* ---------- ticket detail ---------- */
function openDetail(id){
  activeTicketId = id;
  renderDetail();
  document.getElementById('modal-overlay').classList.add('open');
}

function renderDetail(){
  const t = tickets.find(x=>x.id===activeTicketId);
  if(!t) return;
  const steps = ['open','progress','resolved'];
  const modal = document.getElementById('modal-content');
  modal.innerHTML = `
    <h2>#${t.num} — ${escapeHtml(t.title)}</h2>
    <p class="sub">Warehouse ${t.warehouse} · reported by ${escapeHtml(t.reporter||'Unnamed')} · ${timeAgo(t.createdAt)}</p>
    <div class="detail-meta">
      <span class="badge ${t.type==='remote'?'remote':'onsite'}">${t.type==='remote'?'Remote-fixable':'Needs on-site'}</span>
      <span class="badge pri-${t.priority}">${PRIORITY_LABELS[t.priority]}</span>
      <span class="badge status-${t.status}">${STATUS_LABELS[t.status]}</span>
    </div>
    <div class="detail-desc">${t.desc ? escapeHtml(t.desc) : 'No further details given.'}</div>
    <div class="status-steps">
      ${steps.map(s=>`<button class="step-btn ${t.status===s?'current':''}" onclick="setStatus('${s}')">${STATUS_LABELS[s]}</button>`).join('')}
      <button class="step-btn cancel ${t.status==='cancelled'?'current':''}" onclick="setStatus('cancelled')">Cancel ticket</button>
    </div>
    <div class="log-list">
      ${t.log.slice().reverse().map(l=>`<div class="log-item"><b>${escapeHtml(l.note)}</b> — ${timeAgo(l.ts)}</div>`).join('')}
    </div>
    <button class="btn-secondary" onclick="closeModal()">Close</button>
  `;
}

function setStatus(status){
  const t = tickets.find(x=>x.id===activeTicketId);
  if(!t) return;
  t.status = status;
  t.log.push({ note: 'Status changed to ' + STATUS_LABELS[status], ts: Date.now() });
  if(status==='resolved') t.resolvedAt = Date.now();
  saveTickets(tickets);
  renderDetail();
  renderAll();
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  activeTicketId = null;
}
document.getElementById('modal-overlay').addEventListener('click',(e)=>{
  if(e.target.id==='modal-overlay') closeModal();
});

populateWarehouseSelects();
renderAll();
</script>
</body>
</html>
